<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="BMI.css">
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">YouTube</a>
    </nav>

    <form id="bmiForm">
        <h1>BMI CALCULATOR</h1>
        <p><label>Height (m):</label><input type="text" id="hgt"></p> 
        <p><label>Weight (kg):</label><input type="text" id="wght"></p>
        <button type="button" id="sbmt">Submit</button>
        <p id="result"></p>
    </form>
    <script>
       const form = document.querySelector('#bmiForm');
       form.addEventListener("click", function(e) {
        e.preventDefault();
        const height = parseFloat(document.querySelector('#hgt').value);
        const weight = parseFloat(document.querySelector('#wght').value);
        const result = document.querySelector('#result');
       
        if (isNaN(height) || height <= 0) {
            result.innerHTML = `Please give a valid height ${height}`;
        } else if (isNaN(weight) || weight <= 0) {
            result.innerHTML = `Please give a valid weight ${weight}`;
        } else {
            const bmi = (weight / (height * height)).toFixed(2);
            result.innerHTML = `Your BMI is ${bmi}`;
        }
    });
    </script>
</body>
</html>
